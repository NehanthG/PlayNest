name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t nehanthgodishala/playnest-backend ./backend
          docker push nehanthgodishala/playnest-backend

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull nehanthgodishala/playnest-backend

            docker stop playnest-backend || true
            docker rm playnest-backend || true

            docker run -d \
              --name playnest-backend \
              -p 5001:5001 \
              --env-file .env \
              nehanthgodishala/playnest-backend