name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull nehanthgodishala/playnest-backend

            docker stop playnest-backend || true
            docker rm playnest-backend || true

            docker run -d \
              --name playnest-backend \
              -p 5001:5001 \
              --env-file .env \
              nehanthgodishala/playnest-backend